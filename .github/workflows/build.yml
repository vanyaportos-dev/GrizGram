name: Build GrizGram APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename MyTelegram -> GrizGram
        run: |
          grep -rlI "MyTelegram" TMessagesProj/src/main/res TMessagesProj_App/src \
            --include='strings*.xml' \
            --include=AndroidManifest.xml \
            | xargs -r sed -i 's/MyTelegram/GrizGram/g'
          git diff --stat
          if git diff --quiet; then
            echo "::warning::MyTelegram не найден в res/Manifest, название не изменится"
          fi
          echo "--- app_name после замены ---"
          grep -rn 'name="app_name"' --include=strings.xml . || true

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK/NDK components
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "build-tools;30.0.3" "ndk;21.4.7075529"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew :TMessagesProj_App:assembleAfatRelease --stacktrace

      - name: Find APK
        run: find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrizGram-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
